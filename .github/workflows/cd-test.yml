name: CD Test

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Setup SSH key
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Start Cloudflare TCP proxy
        run: |
          cloudflared access tcp \
            --hostname ssh.ngocfggo.io.vn \
            --url localhost:2222 \
            --service-token-id "${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --service-token-secret "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" &

          sleep 5

      - name: SSH to Machine 2
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -p 2222 \
            Admin@localhost \
            "hostname"
      - name: Deploy test
        run: |
          ssh \
          -i ~/.ssh/id_ed25519 \
          -o StrictHostKeyChecking=no \
          -p 2222 \
          Admin@localhost \
          "echo 'Deployed by GitHub Actions' > C:\Users\Admin\idolgioitre-test.txt"
          "echo 'vai loz idol' >> C:\Users\Admin\idolgioitre-test.txt"

